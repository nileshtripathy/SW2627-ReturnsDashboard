name: Deploy Returns Dashboard to GCP

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Prevent duplicate deployments from running simultaneously.
concurrency:
  group: returns-dashboard-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION }}
  SERVICE_NAME: returns-dashboard
  IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/returns-dashboard/app

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Authenticate using Workload Identity Federation
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 3. Configure Google Cloud CLI
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # 4. Authenticate Docker with Artifact Registry
      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            .

      # 6. Push Docker image
      - name: Push Docker image
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"

      # 7. Run Prisma database migrations
      - name: Run Prisma migrations
        run: |
          gcloud run jobs deploy migrate-db \
            --image="${IMAGE}:${GITHUB_SHA}" \
            --region="${REGION}" \
            --command="npx" \
            --args="prisma,migrate,deploy" \
            --set-secrets="DATABASE_URL=${{ secrets.DATABASE_URL_SECRET_NAME }}:latest" \
            --max-retries=0 \
            --quiet

          gcloud run jobs execute migrate-db \
            --region="${REGION}" \
            --wait

      # 8. Deploy the application to Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}

          env_vars: |-
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}

          secrets: |-
            DATABASE_URL=${{ secrets.DATABASE_URL_SECRET_NAME }}:latest

      # 9. Display deployment information
      - name: Deployment summary
        if: success()
        run: |
          echo "Deployment completed successfully."
          echo "Service: ${SERVICE_NAME}"
          echo "Region: ${REGION}"
          echo "Image: ${IMAGE}:${GITHUB_SHA}"
